; =============================================================================
; ESP32-S3 声纹门禁网关 —— PlatformIO 工程配置
; -----------------------------------------------------------------------------
; 板子：ESP32-S3-CORE-BOARD-V1.4（与项目1 同一块板，通过重新烧写切换）
; 模组：ESP32-S3-WROOM-1 **N16R8**（16MB Flash + 8MB **Octal** PSRAM）
;   → 必须用 memory_type = qio_opi（Octal PSRAM 不能用 qio_qspi ✗）
;   → GPIO33~37 被 Octal PSRAM 占用；N16R8 的 Octal PSRAM 还占 26~32，不可他用 ✗
;
; 与项目1（firmware-esp32/）的关系
; -----------------------------------------------------------------------------
;   两个工程**独立**，共享同一块板子：要演示哪个项目就烧哪个固件。
;      项目1（Modbus 网关）：cd firmware-esp32        ; pio run -t upload
;      项目2（声纹网关）    ：cd firmware-esp32-voicelock ; pio run -t upload
;   本工程刻意**复用项目1 已验证过的板级配置**（memory_type / partitions /
;   ARDUINO_USB_CDC_ON_BOOT 等），这些是踩过坑才定下来的：
;     · ARDUINO_USB_CDC_ON_BOOT=0 → Serial 走 UART0(CH343 口)，能直接看到 panic 回溯
;     · memory_type=qio_opi       → N16R8 的 Octal PSRAM 必须这么配
;
; 硬件接线（ESP32-S3 ↔ STM32F103RET6）
; -----------------------------------------------------------------------------
;     ESP32-S3 GPIO4  (UART2 TX) ──→ F103  PB11 (USART3_RX)
;     ESP32-S3 GPIO5  (UART2 RX) ←── F103  PB10 (USART3_TX)
;     GND                        ───  F103  GND        ← ★ 必须共地
;   为什么选 GPIO4/5：N16R8 上这两个脚空闲，且在排针上易接；
;   避开了 8/9(OLED)、10~15/21(TFT)、16~18(RS485)、19/20(USB)、26~37(Flash/PSRAM)。
;
; 本文件**必须保存为 UTF-8（无 BOM）**（否则 PlatformIO 报 UnicodeDecodeError）
; =============================================================================

[env:esp32-s3-devkitc-1]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; --- Flash / PSRAM 配置（N16R8 专用，与项目1 一致）----------------------------
board_build.arduino.memory_type = qio_opi
board_build.partitions          = default_16MB.csv
board_upload.flash_size         = 16MB

build_flags =
    -DBOARD_HAS_PSRAM
    -Iinclude
    -DCORE_DEBUG_LEVEL=3
    ; 0 = Serial 走 UART0 → CH343 口（排查崩溃时最方便，能看到 panic 回溯）
    -DARDUINO_USB_CDC_ON_BOOT=0

; --- 依赖库 -------------------------------------------------------------------
lib_deps =
    ; OLED（SSD1306, I2C 0x3C, SDA=GPIO8 SCL=GPIO9）—— 与项目1 同款屏
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.16.1

monitor_speed = 115200
upload_speed  = 921600
monitor_rts = 0
monitor_dtr = 0

; --- 串口写死（重要）---------------------------------------------------------
; ESP32-S3 两个口的身份：
;   · 原生 USB 口 → VID = 303A（乐鑫），免驱
;   · CH343 口    → VID:PID = 1A86:55D3
; 换口/插拔后 COM 号会变，用 `pio device list` 确认后改下面两行。
upload_port  = COM6
monitor_port = COM6
