; =============================================================================
; ESP32-S3 端侧振动监测网关 —— PlatformIO 工程配置
; -----------------------------------------------------------------------------
; 板子：ESP32-S3-CORE-BOARD-V1.4
; 模组：ESP32-S3-WROOM-1 **N16R8**（16MB Flash + 8MB **Octal** PSRAM）
;   → 必须用 memory_type = qio_opi（Octal PSRAM 不能用 qio_qspi ✗）
;   → GPIO33~37 被 Octal PSRAM 占用，不可他用 ✗
;
; ⚠️ 编码约定：本文件**必须保存为 UTF-8（无 BOM）**。
;    踩过的坑：用 PowerShell 的 Set-Content 直接改这个文件，PS 5.1 会按 GBK 写
;    → PlatformIO 按 UTF-8 解析 → "UnicodeDecodeError: invalid continuation byte" ✗，
;    而且中文注释被二次编码、连配置行都被并进注释里 ✗ → 整个工程编不过 ✗✗
; =============================================================================

[env:esp32-s3-devkitc-1]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; --- Flash / PSRAM 配置（N16R8 专用）-----------------------------------------
; memory_type 形如 <flash_mode>_<psram_mode>：
;   qio_opi = Flash 走 QIO + PSRAM 走 OPI（Octal）—— 这就是 N16R8 需要的 ✓
; 若以后换成没有 PSRAM 的板子：删掉它，并去掉下面的 -DBOARD_HAS_PSRAM。
board_build.arduino.memory_type = qio_opi
board_build.partitions          = default_16MB.csv
board_upload.flash_size         = 16MB

build_flags =
    ; PSRAM 使能。多数情况下 memory_type=qio_opi 已隐含打开，
    ; 这里显式再定义一次，保证 psramFound() / heap_caps_malloc(MALLOC_CAP_SPIRAM) 可用。
    -DBOARD_HAS_PSRAM
    ; 我们自己的 include/ 目录（config.h、lv_conf.h 都在这里）
    -Iinclude
    ; LVGL：告诉它到标准包含路径里找 lv_conf.h ✗→✓
    ;   不加这个宏，LVGL 会去找 "../../lv_conf.h" → fatal error ✗
    -DLV_CONF_INCLUDE_SIMPLE
    ; 调试级别（1=ERROR 2=WARN 3=INFO 4=DEBUG 5=VERBOSE）
    -DCORE_DEBUG_LEVEL=3
    ; USB 日志输出口：
    ;   1 = Serial 走原生 USB（免驱；但**只有插原生 USB 口才能看到日志** ✗）
    ;   0 = Serial 走 UART0 → CH343 口（需要 CH343 驱动，但 CH343 口能看到全部日志 ✓）
    ; 排查崩溃时用 0 最方便（能直接看到 panic 回溯）✓
    -DARDUINO_USB_CDC_ON_BOOT=0

    ; =========================================================================
    ; 屏幕配置：**已全部移到代码里**（src/gui.cpp 的 LCD 类 + include/config.h）
    ; -------------------------------------------------------------------------
    ; 原来这里有一大堆 TFT_eSPI 的 -D 宏（驱动/引脚/SPI 频率），
    ; 换成 LovyanGFX 之后**不再需要**：
    ;   · LovyanGFX 的面板参数写在代码里的一个 LGFX 子类中
    ;     （见 gui.cpp 的 `class Lcd : public lgfx::LGFX_Device`），
    ;     **换屏只改那一个类**，不像 TFT_eSPI 要动平台的编译期宏；
    ;   · 引脚口径统一在 include/config.h §4.2（TFT_PIN_*）。
    ; 这里保留位置说明，避免后来人再去找那些 -D 宏。
    ; =========================================================================

; --- 依赖库 -----------------------------------------------------------------
lib_deps =
    lvgl/lvgl@^8.3.11
    ; ---- 显示驱动 ----
    ; ★ 2026-10 换成 LovyanGFX ★
    ;   为什么弃用 TFT_eSPI：本工程在 Arduino-ESP32 2.0.17（core 2.x）下，
    ;   TFT_eSPI 2.5.43 的 init() **必崩**：
    ;       Guru Meditation (StoreProhibited), EXCVADDR=0x10,
    ;       Backtrace: writecommand → begin_tft_write → TFT_eSPI::init
    ;   已排除：TFT_MISO 未定义、SPI.begin 未调用、SPI_PORT 宏未解析、
    ;           **屏没接（接上照崩）**。
    ;   崩点是 `SET_BUS_WRITE_MODE`（`*_spi_user = SPI_USR_MOSI`）——该库在
    ;   core 2.x 上直接操作 SPI 寄存器，与当前核心版本不兼容。
    ;   LovyanGFX 自己实现 ESP32-S3 的 SPI 驱动（用 esp-idf 的 spi_master），
    ;   **既不依赖 Arduino 的 SPIClass，也不碰寄存器宏**，从根上绕开这类问题。
    ;   ⚠ TFT_eSPI 保留在依赖里只是"备查"（下面这行注释掉即不再编译）。
    ;bodmer/TFT_eSPI@^2.5.43
    lovyan03/LovyanGFX@^1.1.16
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.3
    ; ⚠ 作者名是 tanakama**sa**yuki（sa 不是 su）。
    ;   2026-10 被改错过一次，症状是 PlatformIO 报
    ;   `UnknownPackageError: Could not find the package with
    ;    'tanakamasuyuki/TensorFlowLite_ESP32 @ ^1.0.0' requirements` ——
    ;   看着像"网络挂了"，其实是名字拼错，注册表里搜不到。
    tanakamasayuki/TensorFlowLite_ESP32@^1.0.0

monitor_speed = 115200
upload_speed  = 921600
monitor_rts = 0
monitor_dtr = 0

; --- 串口写死（重要 ✗→✓）---------------------------------------------------
; PlatformIO 的"自动选口"按**常见 USB 串口芯片**匹配，会把 F411 板载的
; CH340(1A86:7523) 当成目标 ✗，报错长这样：
;     Failed to connect to ESP32-S3: No serial data received
;     A fatal error occurred: Invalid head of packet (0x5B)
; ESP32-S3 两个口的身份：
;   · 原生 USB 口 → VID = **303A**（乐鑫），免驱，描述是 "USB 串行设备"
;   · CH343 口    → VID:PID = **1A86:55D3**，描述是 "USB-Enhanced-SERIAL CH343"
; 用 `pio device list` 或设备管理器确认后改下面两行（换口/插拔后 COM 号会变）。
upload_port  = COM6
monitor_port = COM6

; =============================================================================
; 仿真环境：没有硬件时用来跑逻辑测试（复用主环境的配置）
; =============================================================================
[env:esp32-s3-devkitc-1-sim]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions          = default_16MB.csv
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DSIM_MODE=1
lib_deps =
    ${env:esp32-s3-devkitc-1.lib_deps}
monitor_speed = 115200
